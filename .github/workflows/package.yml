name: Package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_release:
        description: '不创建 Release'
        required: false
        default: true
        type: boolean

jobs:
  package:
    name: 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 打包
        run: |
          mkdir -p kComics
          cp -r bin kComics/
          cp config.xml menu.json kComics/
          NAME="kComics-${GITHUB_REF_NAME:-latest}.zip"
          echo "ARCHIVE=$NAME" >> "$GITHUB_ENV"
          zip -r "$NAME" kComics
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: kcomics-package
          path: kComics-*.zip

  create-release:
    name: 创建发布
    needs: [package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.skip_release != 'true'
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/kcomics-package/kComics-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
